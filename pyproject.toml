[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grace-hymn-splitter"
version = "0.2.5"
description = "把多段式简谱拆成适合 PPT 投影的分段大图。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WangYufan", email = "yufan14710@gmail.com" }]
urls = { Homepage = "https://github.com/JJosephph/grace-hymn-splitter", Repository = "https://github.com/JJosephph/grace-hymn-splitter" }
dependencies = [
  "Pillow>=11.0,<12",
  "pywebview>=6.2,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
grace-hymn-splitter = "hymn_splitter.gui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hymn_splitter*"]

[tool.setuptools.package-data]
hymn_splitter = ["web/*", "web/assets/*"]
